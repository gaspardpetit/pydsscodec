name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-14
          - name: windows-x86_64
            os: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set release version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag) {
            throw "github.ref_name is empty"
          }

          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag '$tag' must be in the form vX.Y.Z"
          }

          Write-Host "Using package version: $version"

          $cargo = Get-Content Cargo.toml -Raw
          $versionPattern = '(?m)^version = "[^"]*"\r?$'
          $matches = [regex]::Matches($cargo, $versionPattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one package version in Cargo.toml, found $($matches.Count)"
          }

          $cargo = [regex]::Replace(
            $cargo,
            $versionPattern,
            "version = `"$version`"",
            1
          )
          Set-Content Cargo.toml $cargo -Encoding utf8 -NoNewline

          $updatedCargo = Get-Content Cargo.toml -Raw
          $expectedVersion = "version = `"$version`""
          if ($updatedCargo -notmatch "(?m)^$([regex]::Escape($expectedVersion))\r?$") {
            throw "Cargo.toml package version was not updated to $version"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: . -> target

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run Python tests
        run: uv run pytest

      - name: Run upstream Rust tests
        run: cargo test --manifest-path ext/dss-codec/dss-codec/Cargo.toml --locked -- --test-threads=1

      - name: Build source distribution
        if: runner.os == 'Linux'
        run: uv build --sdist

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist -i python3.10

      - name: Build non-Linux wheels
        if: runner.os != 'Linux'
        run: uv build --wheel

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Validate distribution versions
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $expectedPrefix = "pydsscodec-$version"
          $distributions = @(Get-ChildItem dist -File)

          if ($distributions.Count -eq 0) {
            throw "No distributions were downloaded"
          }

          $unexpected = @(
            $distributions | Where-Object { -not $_.Name.StartsWith($expectedPrefix) }
          )
          if ($unexpected.Count -gt 0) {
            $names = $unexpected.Name -join ', '
            throw "Distributions do not match release version ${version}: $names"
          }

          Write-Host "Validated $($distributions.Count) distributions for version $version"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
